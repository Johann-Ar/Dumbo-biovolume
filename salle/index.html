<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Présences rares — la salle</title>
  <link rel="icon" href="../img/presences_rares_favicon_v2.png">
  <style>
    :root { --ink: #d8e4ee; --dim: rgba(216, 228, 238, 0.55); }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--ink);
      font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    #app, canvas { position: fixed; inset: 0; display: block; touch-action: none; }
    #intro { position: fixed; inset: 0; display: grid; place-items: center; background: #000; cursor: pointer;
      transition: opacity 1.6s ease; z-index: 2; }
    #intro.hidden { opacity: 0; pointer-events: none; }
    #intro .box { text-align: center; padding: 0 16px; }
    #intro h1 { font-weight: 300; letter-spacing: 0.32em; font-size: clamp(22px, 4vw, 40px); margin: 0 0 10px; }
    #intro p { color: var(--dim); font-size: 13px; letter-spacing: 0.08em; margin: 6px 0; }
    #intro .enter { margin-top: 28px; display: inline-block; border: 1px solid var(--dim); padding: 10px 26px;
      letter-spacing: 0.25em; font-size: 12px; }
    #hud { position: fixed; left: 16px; bottom: 14px; font-size: 11px; color: var(--dim); letter-spacing: 0.06em;
      opacity: 0; transition: opacity 2s ease 2s; pointer-events: none; z-index: 1; line-height: 1.7; }
    #hud.visible { opacity: 1; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="intro">
    <div class="box">
      <h1>PRÉSENCES RARES</h1>
      <p>Une exposition qui n'existe qu'ici.</p>
      <p>Prototype de la salle — vitres volumétriques</p>
      <span class="enter">ENTRER</span>
    </div>
  </div>
  <div id="hud">ZQSD / flèches : marcher · souris : regarder · Maj : ralentir</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
